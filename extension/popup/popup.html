<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tab Pet - Pomodoro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="pet-brand">
        <span class="pet-icon">🐾</span>
        <div>
          <h1 class="brand-title">Tab Pet</h1>
          <div class="status-pills">
            <span id="connectionStatus" class="status-badge disconnected">Connecting...</span>
            <span id="aiStatus" class="status-badge ai-badge hidden">Offline Mode</span>
          </div>
        </div>
      </div>
      <a href="../options/options.html" target="_blank" class="gear-btn" title="Settings">⚙️</a>
    </header>

    <!-- Focus Goal Field -->
    <div class="goal-card">
      <label for="focusGoalInput" class="goal-label">🎯 What are you working on?</label>
      <input type="text" id="focusGoalInput" class="goal-input" placeholder="e.g. Study algorithms, research paper">
    </div>

    <!-- Timer Card -->
    <div class="timer-card">
      <div id="sessionBadge" class="session-badge idle">Ready to Focus</div>
      <div id="timeDisplay" class="time-display">25:00</div>
      <div class="timer-controls">
        <button id="startWorkBtn" class="primary-btn">Start Focus</button>
        <button id="startBreakBtn" class="secondary-btn">Take Break</button>
        <button id="stopBtn" class="danger-btn hidden">Stop</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-box">
        <span class="stat-value" id="statBlocks">0</span>
        <span class="stat-label">Blocked Today</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="statFocus">0m</span>
        <span class="stat-label">Focus Time</span>
      </div>
      <div class="stat-box">
        <span class="stat-value" id="statStreak">1d</span>
        <span class="stat-label">Daily Streak</span>
      </div>
    </div>

    <!-- Pet's Notes Card -->
    <div class="notes-card">
      <div class="notes-header">
        <span class="notes-title">📝 Pet's Notes</span>
        <span id="trustBadge" class="trust-badge">Trust: 50%</span>
      </div>
      <div class="notes-summary">
        <span>Saves: <strong id="notesSaves">0</strong></span>
        <span>•</span>
        <span>Blocks: <strong id="notesBlocks">0</strong></span>
        <span>•</span>
        <span>Pleas: <strong id="notesPleas">0</strong></span>
      </div>
      <div id="recentEventsList" class="recent-events-list">
        <div class="event-empty">No recent events yet. Stay focused!</div>
      </div>
    </div>

    <!-- Footer toggles -->
    <footer class="footer">
      <label class="toggle-row">
        <span>Local Only (Disable AI)</span>
        <input type="checkbox" id="localOnlyToggle">
      </label>
      <label class="toggle-row">
        <span>Sound Effects</span>
        <input type="checkbox" id="soundToggle" checked>
      </label>
      <div class="privacy-note">🔒 Privacy: Only sanitized URLs & titles are sent</div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
